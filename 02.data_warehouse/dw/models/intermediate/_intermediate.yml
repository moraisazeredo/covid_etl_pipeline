# models/intermediate/_intermediate.yml
version: 2

models:
  - name: int_dim_country
    description: "Dimensão de países (1 linha por país)"
    columns:
      - name: country_id
        data_tests: [unique, not_null]

  - name: int_dim_date
    description: "Dimensão de datas dos retratos (1 linha por dia)"
    columns:
      - name: date_id
        data_tests: [unique, not_null]

  - name: int_fct_covid_daily
    description: "Fato diária: 1 linha por país × dia de retrato"
    data_tests:
      # Garante a granularidade: não pode haver o mesmo país duas vezes no mesmo dia
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_id, country_id]
    columns:
      - name: country_id
        data_tests:
          - not_null
          - relationships:          # Todo país da fato precisa existir na dimensão
              to: ref('int_dim_country')
              field: country_id
      - name: date_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_dim_date')
              field: date_id
